<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tamsin Scholz</title>
  <style>
    :root {
      --ink: #1c1d22;
      --ink-soft: #4a4d57;
      --ink-faint: #8a8e99;
      --paper: #f6f3ec;
      --paper-deep: #ece7dc;
      --rule: #d8d1c1;
      --accent: #5b4eb2;
      --accent-soft: #e3dffb;
      --ease: cubic-bezier(.2,.7,.2,1);
      --serif: ui-serif, Georgia, "Iowan Old Style", "Apple Garamond", serif;
      --sans: ui-sans-serif, system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--serif);
      -webkit-font-smoothing: antialiased;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      place-items: center;
      padding: 6vh 16px;
      overflow-x: hidden;
    }
    main {
      position: relative;
      width: 100%;
      max-width: 760px;
      text-align: center;
    }
    /* Giant ghost monogram behind the name */
    .mono {
      position: absolute;
      inset: 50% auto auto 50%;
      transform: translate(-50%, -62%);
      font-size: clamp(14rem, 52vw, 30rem);
      font-style: italic;
      line-height: 1;
      letter-spacing: -.12em;
      color: var(--accent-soft);
      z-index: -1;
      user-select: none;
      white-space: nowrap;
    }
    h1 {
      margin: 0;
      font-weight: 500;
      font-size: clamp(2.6rem, 9vw, 5rem);
      letter-spacing: -.02em;
      line-height: 1;
    }
    .tag {
      margin: 1rem 0 0;
      font-style: italic;
      color: var(--ink-soft);
      font-size: 1.1rem;
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1.25rem;
      max-width: 740px;
      margin: 9vh auto 0;
    }
    .card {
      display: block;
      padding: 1.6rem 1.6rem 1.4rem;
      background: #fff;
      border: 1px solid var(--rule);
      border-radius: 18px;
      box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 10px 30px rgba(0,0,0,.06);
      color: inherit;
      text-decoration: none;
      text-align: left;
      transition: transform .35s var(--ease), box-shadow .35s var(--ease), border-color .35s var(--ease);
    }
    .card:hover, .card:focus-visible {
      transform: translateY(-4px) rotate(-.6deg);
      border-color: var(--accent);
      box-shadow: 0 2px 4px rgba(0,0,0,.05), 0 18px 40px rgba(91,78,178,.18);
      outline: none;
    }
    .card__figure {
      display: block;
      font-size: clamp(3.6rem, 14vw, 5.5rem);
      line-height: .9;
      letter-spacing: -.04em;
      color: var(--accent);
      font-variant-numeric: oldstyle-nums;
    }
    .card__label {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-top: .8rem;
      font-family: var(--sans);
      font-size: .8rem;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--ink-soft);
    }
  </style>
</head>
<body>
  <main>
    <div class="mono" aria-hidden="true">TS</div>
    <h1>Tamsin Scholz</h1>
    <p class="tag">a small corner of the internet</p>
    <nav class="cards" aria-label="Projects">
      <a class="card" href="summer-school-2026/">
        <span class="card__figure">2026</span>
        <span class="card__label"><span>Summer School 2026</span><span aria-hidden="true">&rarr;</span></span>
      </a>
      <a class="card" href="geospiel/">
        <span class="card__figure">16</span>
        <span class="card__label"><span>Geospiel</span><span aria-hidden="true">&rarr;</span></span>
      </a>
    </nav>
  </main>
</body>
</html>
