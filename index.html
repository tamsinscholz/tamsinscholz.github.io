<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tamsin Scholz</title>
  <style>
    :root {
      --ink: #1c1d22;
      --ink-soft: #4a4d57;
      --ink-faint: #8a8e99;
      --paper: #f6f3ec;
      --paper-deep: #ece7dc;
      --rule: #d8d1c1;
      --accent: #5b4eb2;
      --accent-soft: #e3dffb;
      --ease: cubic-bezier(.2,.7,.2,1);
      --serif: ui-serif, Georgia, "Iowan Old Style", "Apple Garamond", serif;
      --sans: ui-sans-serif, system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--serif);
      -webkit-font-smoothing: antialiased;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      place-items: center;
      padding: 6vh 16px;
      overflow-x: hidden;
    }
    main {
      position: relative;
      width: 100%;
      max-width: 760px;
      text-align: center;
    }
    /* Giant ghost monogram behind the name */
    .masthead { position: relative; isolation: isolate; }
    .mono {
      position: absolute;
      inset: 50% auto auto 50%;
      transform: translate(-50%, -38%);
      font-size: clamp(14rem, 52vw, 30rem);
      font-style: italic;
      line-height: 1;
      letter-spacing: -.12em;
      color: var(--accent-soft);
      z-index: -1;
      user-select: none;
      white-space: nowrap;
    }
    h1 {
      margin: 0;
      font-weight: 500;
      font-size: clamp(2.6rem, 9vw, 5rem);
      letter-spacing: -.02em;
      line-height: 1;
    }
    .tag {
      margin: 1rem 0 0;
      font-style: italic;
      color: var(--ink-soft);
      font-size: 1.1rem;
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1.25rem;
      max-width: 740px;
      margin: 9vh auto 0;
    }
    .card {
      position: relative;
      overflow: hidden;
      display: block;
      min-height: 220px;
      padding: 1.6rem 40% 1.4rem 1.6rem;
      background: #fff;
      border: 1px solid var(--rule);
      border-radius: 18px;
      box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 10px 30px rgba(0,0,0,.06);
      color: inherit;
      text-decoration: none;
      text-align: left;
      transition: transform .35s var(--ease), box-shadow .35s var(--ease), border-color .35s var(--ease);
    }
    .card:hover, .card:focus-visible {
      transform: translateY(-4px) rotate(-.6deg);
      border-color: var(--accent);
      box-shadow: 0 2px 4px rgba(0,0,0,.05), 0 18px 40px rgba(91,78,178,.18);
      outline: none;
    }
    /* Each card's artwork sits faded in the bottom-right corner, cropped by the card */
    .art {
      position: absolute;
      right: -8%;
      bottom: -14%;
      height: 92%;
      width: auto;
      opacity: .2;
      transition: opacity .4s var(--ease), transform .6s var(--ease);
    }
    .card:hover .art, .card:focus-visible .art { opacity: .38; transform: translate(-6px, -6px); }
    .art--de path { fill: var(--accent); }
    /* ß outline from Source Serif 4 Italic (SIL Open Font License), drawn as
       a path: Safari clips the overhang of real italic text while it animates */
    .art--glyph { right: 3%; bottom: -31%; height: 116%; }
    .art--glyph path { fill: var(--accent); }
    .card__meta {
      font-family: var(--sans);
      font-size: .72rem;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--ink-faint);
    }
    .card__title {
      display: block;
      margin-top: .6rem;
      font-size: 2rem;
      line-height: 1.1;
      letter-spacing: -.015em;
    }
    .card__title em { color: var(--accent); }
    .card__blurb {
      display: block;
      margin-top: .45rem;
      color: var(--ink-soft);
      font-size: .98rem;
      line-height: 1.4;
    }
    .card__go {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      margin-top: 2rem;
      color: var(--accent);
    }
    .card__go .card__meta { color: inherit; }
    .arrow {
      width: 1.1rem;
      height: 1.1rem;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform .35s var(--ease);
    }
    .card:hover .arrow, .card:focus-visible .arrow { transform: translateX(4px); }
  </style>
</head>
